name: Kitmage distribution checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.1', extensions: zip }
      - uses: ramsey/composer-install@v3
        with:
          composer-options: --no-dev --no-scripts --optimize-autoloader
      - name: PHP syntax
        run: find kitmage -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Regression contracts
        run: php tests/kitmage/static-regression.php
      - name: Package and verify tutor slug
        run: ./scripts/build-release.sh
